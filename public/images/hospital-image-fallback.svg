<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title description">
  <title id="title">Facility photo unavailable</title>
  <desc id="description">A neutral healthcare symbol used when no permitted facility photo is available.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10243d"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
  </defs>
  <rect width="960" height="480" fill="url(#background)"/>
  <circle cx="480" cy="220" r="105" fill="#1e3a5f" stroke="#60a5fa" stroke-opacity=".45" stroke-width="3"/>
  <path d="M455 165h50v30h30v50h-30v30h-50v-30h-30v-50h30z" fill="#bfdbfe"/>
  <text x="480" y="390" fill="#dbeafe" font-family="Arial,sans-serif" font-size="25" text-anchor="middle">Facility photo unavailable</text>
</svg>
